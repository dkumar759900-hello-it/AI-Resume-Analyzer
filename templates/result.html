<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Analysis</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #66ea7e, #66a0b9);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            text-align: center;
            font-size: 50px;
            color: white;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            max-width: 1000px;
            margin: auto;
            padding: 50px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        h2 {
            color: #4f46e5;
            margin-top: 30px;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
            margin-bottom: 12px;
        }

        ul {
            margin-left: 25px;
            line-height: 1.8;
        }

        li {
            margin-bottom: 10px;
            font-size: 17px;
        }

        .score-box {
            text-align: center;
            margin-bottom: 35px;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
            color: #28a745;
        }

        .badge {
            display: inline-block;
            background: #e8f0ff;
            color: #4f46e5;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .btn-area {
            text-align: center;
            margin-top: 25px;
        }

        .back-btn {
            display: inline-block;
            padding: 14px 28px;
            background: #46e576;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #2f7acf;
        }

        @media(max-width:768px) {
            h1 {
                font-size: 34px;
            }

            .card {
                padding: 25px;
            }

            .score {
                font-size: 38px;
            }
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>🤖 AI Resume Analysis</h1>

        <div class="card">

            <div class="badge">
                AI Powered Resume Review
            </div>

            {{ result|safe }}

        </div>

        <div class="btn-area">
            <a href="/" class="back-btn">
                Analyze Another Resume
            </a>
        </div>

    </div>

</body>

</html>
